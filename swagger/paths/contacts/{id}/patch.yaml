tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update an existing contact's details by ID. Supports multipart/form-data for image uploads.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: Contact ID
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  "200":
    description: Successfully updated a contact!
  "401":
    description: Unauthorized
  "404":
    description: Contact not found
